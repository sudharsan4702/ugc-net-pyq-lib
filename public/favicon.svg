<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle App Badge Background -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />

  <!-- Inner Subtle Accent Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3" />

  <!-- Academic Mortarboard & Book Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap Diamond -->
    <polygon points="32,11 55,22 32,32 9,22" fill="#ffffff" />
    
    <!-- Cap Skull Base -->
    <path d="M19 27.5 v 6.5 c 0 4.2 5.8 7.5 13 7.5 s 13 -3.3 13 -7.5 v -6.5 c -3.5 2 -7.8 3 -13 3 s -9.5 -1 -13 -3 z" fill="#e0e7ff" />

    <!-- Golden Tassel & Button -->
    <circle cx="32" cy="21.5" r="2.5" fill="url(#goldGrad)" />
    <path d="M32 21.5 Q 46 23 47 37" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="45,36 49,36 48,43 46,43" fill="url(#goldGrad)" />

    <!-- Open Book / Pages at Base -->
    <!-- Left Page -->
    <path d="M14 47 c 5 -2.5 11 -2.5 17 0.5 v 7 c -6 -3 -12 -3 -17 -0.5 z" fill="#ffffff" />
    <!-- Right Page -->
    <path d="M50 47 c -5 -2.5 -11 -2.5 -17 0.5 v 7 c 6 -3 12 -3 17 -0.5 z" fill="#e2e8f0" />
    <!-- Book Center Spine -->
    <line x1="31" y1="47.5" x2="31" y2="54.5" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
